services:
    frontend:
        build:
            context: .
            dockerfile: ./frontend/Dockerfile
            args:
                ENV: ${ENV}
            tags:
                - swe40006-project-frontend
        container_name: swe40006-project-frontend
        environment:
            VITE_API_URL: "http://localhost:${BACKEND_PORT:-5000}"
        ports:
            - "${FRONTEND_PORT:-4173}:4173"
        develop:
            watch:
                - action: sync
                  path: ./frontend
                  target: /usr/src/app/frontend
                  initial_sync: true
                  ignore:
                      - ./frontend/package.json
                - action: rebuild
                  path: package.json
                  target: /usr/src/app/package.json
                - action: rebuild
                  path: ./frontend/package.json
                  target: /usr/src/app/frontend/package.json

    backend:
        build:
            context: .
            dockerfile: ./backend/Dockerfile
            args:
                ENV: ${ENV}
            tags:
                - swe40006-project-backend
        container_name: swe40006-project-backend
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@swe40006-project-db:5432/${POSTGRES_DB}"
        ports:
            - "${BACKEND_PORT:-5000}:5000"
        depends_on:
            db:
                condition: service_healthy
        develop:
            watch:
                - action: sync+restart
                  path: ./backend
                  target: /usr/src/app/backend
                  initial_sync: true
                  ignore:
                      - ./backend/package.json
                - action: rebuild
                  path: package.json
                  target: /usr/src/app/package.json
                - action: rebuild
                  path: ./backend/package.json
                  target: /usr/src/app/backend/package.json

    db:
        image: postgres:17
        container_name: swe40006-project-db
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?error}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
            POSTGRES_DB: ${POSTGRES_DB:?error}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
            interval: 2s
            retries: 10
            start_period: 30s
            timeout: 10s

volumes:
    pgdata:
