services:
    frontend:
        build:
            context: .
            dockerfile: ./frontend/Dockerfile
            tags:
                - swe40006-project-frontend
        container_name: swe40006-project-frontend
        environment:
            VITE_API_URL: "localhost:${BACKEND_PORT}"
        ports:
            - "${FRONTEND_PORT}:4173"

    backend:
        build:
            context: .
            dockerfile: ./backend/Dockerfile
            tags:
                - swe40006-project-backend
        container_name: swe40006-project-backend
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@swe40006-project-db:5432/${POSTGRES_DB}"
        ports:
            - "${BACKEND_PORT}:5000"
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:17
        container_name: swe40006-project-db
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
            interval: 2s
            retries: 10
            start_period: 30s
            timeout: 10s

volumes:
    pgdata:
