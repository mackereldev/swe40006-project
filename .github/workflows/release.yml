name: Release

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]

jobs:
    release:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.head_branch, 'v') }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install zip
              uses: montudor/action-zip@v1
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build packages
              run: pnpm run build
            - name: Zip backend
              run: unzip -qq -r backend.zip **
              working-directory: ./backend/dist
            - name: Zip frontend
              run: unzip -qq -r frontend.zip **
              working-directory: ./frontend/dist
            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      ./backend/dist/backend.zip
                      ./frontend/dist/frontend.zip
                      LICENSE
