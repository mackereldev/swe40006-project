name: Main

on:
    push:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    ci:
        name: Formatting, Static Analysis and Tests
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Check formatting
              run: pnpm run format
            - name: Run lint
              run: pnpm run lint
            - name: Compile backend
              run: pnpm exec tsc --noEmit
              working-directory: ./backend
            - name: Compile frontend
              run: pnpm exec tsc --noEmit
              working-directory: ./frontend
            - name: Install latest Docker Compose
              run: |
                  mkdir -p ~/.docker/cli-plugins
                  curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
                      -o ~/.docker/cli-plugins/docker-compose
                  chmod +x ~/.docker/cli-plugins/docker-compose
                  docker compose version
            - name: Create Docker Compose environment file
              run: cp .env.example .env
            - name: Start database and backend containers
              run: docker compose up --detach --build --wait db backend
            - name: Initialise database schema
              run: docker compose exec -T backend pnpm exec prisma db init -y
            - name: Run unit, integration and regression tests with coverage
              run: docker compose exec -T backend pnpm run test:coverage
            - name: Copy coverage report out of the backend container
              if: always()
              run: docker compose cp backend:/usr/src/app/backend/coverage ./coverage || echo "No coverage report was generated"
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: ./coverage
            - name: Stop containers
              if: always()
              run: docker compose down --volumes || true

    aws-access-smoke-test:
        name: AWS Deployment Preflight
        needs: ci
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            S3_BUCKET: ${{ vars.S3_BUCKET }}
            CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        steps:
            - name: Validate deployment configuration
              run: |
                  test -n "$S3_BUCKET" || { echo "S3_BUCKET repository variable is required" >&2; exit 1; }
                  test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "CLOUDFRONT_DISTRIBUTION_ID repository variable is required" >&2; exit 1; }
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Verify deployment role and inspect attached IAM policies
              run: |
                  set -euo pipefail
                  expected_role_arn="arn:aws:iam::418043654854:role/github-actions-guestbook-deploy"
                  role_name="github-actions-guestbook-deploy"
                  caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
                  echo "Assumed identity: ${caller_arn}"
                  case "$caller_arn" in
                    arn:aws:sts::418043654854:assumed-role/${role_name}/*) ;;
                    *)
                      echo "::error::Expected to assume ${expected_role_arn}, but got ${caller_arn}."
                      exit 1
                      ;;
                  esac

                  if managed_policies="$(aws iam list-attached-role-policies \
                    --role-name "$role_name" \
                    --query 'AttachedPolicies[].{PolicyName:PolicyName,PolicyArn:PolicyArn}' \
                    --output json)"; then
                    echo "Managed policies attached to ${role_name}:"
                    printf '%s\n' "$managed_policies" | jq .
                  else
                    echo "::warning::Could not list managed policies; the role needs iam:ListAttachedRolePolicies for inventory. Continuing to the SSM access check."
                  fi

                  if inline_policies="$(aws iam list-role-policies \
                    --role-name "$role_name" \
                    --query 'PolicyNames' \
                    --output json)"; then
                    echo "Inline policies attached to ${role_name}:"
                    printf '%s\n' "$inline_policies" | jq .
                  else
                    echo "::warning::Could not list inline policies; the role needs iam:ListRolePolicies for inventory. Continuing to the SSM access check."
                  fi
            - name: Check AWS identity and SSM permissions
              run: |
                  set -euo pipefail
                  instance_arn="arn:aws:ec2:ap-southeast-2:418043654854:instance/i-0908e98d81afaaee4"
                  document_arn="arn:aws:ssm:ap-southeast-2:418043654854:document/SSM-SessionManagerRunShell"
                  check_ssm_start_session_access() {
                    local resource_arn="$1"
                    local resource_label="$2"
                    local evaluation

                    evaluation="$(aws iam simulate-principal-policy \
                      --policy-source-arn arn:aws:iam::418043654854:role/github-actions-guestbook-deploy \
                      --action-names ssm:StartSession \
                      --resource-arns "$resource_arn" \
                      --query 'EvaluationResults[].EvalDecision' \
                      --output json)"

                    echo "ssm:StartSession simulation for ${resource_label}:"
                    printf '%s\n' "$evaluation" | jq .
                    if ! jq -e 'length == 1 and .[0] == "allowed"' <<< "$evaluation" >/dev/null; then
                      echo "::error::ssm:StartSession is not allowed for ${resource_label} (${resource_arn})."
                      return 1
                    fi
                  }

                  check_ssm_start_session_access "$instance_arn" "target instance"
                  check_ssm_start_session_access "$document_arn" "session document"
                  echo "ssm:StartSession is allowed on both the target instance and session document."
            - name: Install Session Manager plugin
              run: |
                  set -euo pipefail
                  package="${RUNNER_TEMP}/session-manager-plugin.deb"
                  curl -fsSL \
                    https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
                    -o "$package"
                  sudo dpkg -i "$package"
                  session-manager-plugin --version
            - name: Verify EC2 and SSM target
              shell: bash
              env:
                  AWS_REGION: ap-southeast-2
                  SSM_TARGET_INSTANCE_ID: i-0908e98d81afaaee4
              run: |
                  set -euo pipefail

                  echo "Checking EC2 instance..."
                  aws ec2 describe-instances \
                    --region "$AWS_REGION" \
                    --instance-ids "$SSM_TARGET_INSTANCE_ID" \
                    --query 'Reservations[0].Instances[0].{Id:InstanceId,State:State.Name}' \
                    --output table

                  echo "Checking SSM managed-node registration..."
                  aws ssm describe-instance-information \
                    --region "$AWS_REGION" \
                    --filters "Key=InstanceIds,Values=$SSM_TARGET_INSTANCE_ID" \
                    --query 'InstanceInformationList[].{Id:InstanceId,PingStatus:PingStatus,Platform:PlatformName}' \
                    --output table
            - name: Diagnose SSM target status
              shell: bash
              env:
                  AWS_REGION: ap-southeast-2
                  SSM_TARGET_INSTANCE_ID: i-0908e98d81afaaee4
              run: |
                  set -euo pipefail

                  echo "Active AWS identity:"
                  aws sts get-caller-identity

                  echo "SSM managed-node status:"
                  aws ssm describe-instance-information \
                    --region "$AWS_REGION" \
                    --filters "Key=InstanceIds,Values=$SSM_TARGET_INSTANCE_ID" \
                    --query 'InstanceInformationList[*].[InstanceId,PingStatus,AgentVersion]' \
                    --output table

            - name: Test actual SSM session access
              shell: bash
              env:
                  SSM_TARGET_INSTANCE_ID: i-0908e98d81afaaee4
                  AWS_REGION: ap-southeast-2
              run: |
                  set -euo pipefail

                  echo "SSM target: '$SSM_TARGET_INSTANCE_ID'"
                  echo "AWS region: '$AWS_REGION'"

                  session_log="$(mktemp)"
                  trap 'rm -f "$session_log"' EXIT

                  set +e
                  printf 'exit\n' | timeout --signal=INT --kill-after=5s 30s \
                    script --quiet --return --command \
                      "aws ssm start-session --target ${SSM_TARGET_INSTANCE_ID} --region ${AWS_REGION}" \
                      /dev/null >"$session_log" 2>&1
                  session_status=$?
                  set -e

                  cat "$session_log"

                  if ! grep -q 'Starting session with SessionId:' "$session_log"; then
                    echo "::error::SSM did not return a session ID; the actual StartSession check failed."
                    exit 1
                  fi

                  if [ "$session_status" -ne 0 ]; then
                    echo "::error::The SSM session did not close cleanly (exit ${session_status})."
                    exit 1
                  fi

                  echo "A real SSM session was opened and closed successfully."
            - name: Verify S3 bucket and CloudFront distribution access
              run: |
                  aws s3api head-bucket --bucket "$S3_BUCKET"
                  aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" >/dev/null
            - name: Test S3 upload, read, and cleanup
              run: |
                  set -euo pipefail
                  aws s3api head-bucket --bucket "$S3_BUCKET"

                  object_key="_ci-smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.txt"
                  source_file="$(mktemp)"
                  downloaded_file="$(mktemp)"
                  cleanup() {
                    aws s3api delete-object --bucket "$S3_BUCKET" --key "$object_key" >/dev/null || \
                      echo "Warning: failed to delete S3 smoke-test object s3://${S3_BUCKET}/${object_key}" >&2
                    rm -f "$source_file" "$downloaded_file"
                  }
                  trap cleanup EXIT

                  printf '%s\n' "GitHub Actions S3 access test ${GITHUB_RUN_ID}" > "$source_file"
                  aws s3api put-object --bucket "$S3_BUCKET" --key "$object_key" --body "$source_file" >/dev/null
                  aws s3api get-object --bucket "$S3_BUCKET" --key "$object_key" "$downloaded_file" >/dev/null
                  cmp "$source_file" "$downloaded_file"
                  echo "S3 upload and read succeeded for the temporary smoke-test object."

    deploy-frontend:
        name: Build & Deploy Frontend
        needs: aws-access-smoke-test
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            S3_BUCKET: ${{ vars.S3_BUCKET }}
            CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
            VITE_API_URL: ${{ vars.PROD_API_URL }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build frontend
              run: pnpm --dir frontend run build
            - name: Validate deployment configuration
              run: |
                  test -n "$S3_BUCKET" || { echo "S3_BUCKET repository variable is required" >&2; exit 1; }
                  test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "CLOUDFRONT_DISTRIBUTION_ID repository variable is required" >&2; exit 1; }
                  test -n "$VITE_API_URL" || { echo "PROD_API_URL repository variable is required" >&2; exit 1; }
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Upload frontend to private S3
              run: aws s3 sync frontend/dist/ "s3://${S3_BUCKET}/" --delete
            - name: Invalidate CloudFront cache
              run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

    build-backend:
        name: Build Backend
        needs: aws-access-smoke-test
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            PROD_FRONTEND_ORIGIN: ${{ vars.PROD_FRONTEND_ORIGIN }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Validate build configuration
              run: |
                  test -n "$PROD_FRONTEND_ORIGIN" || { echo "PROD_FRONTEND_ORIGIN repository variable is required" >&2; exit 1; }
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build backend
              run: pnpm --dir backend run build
              env:
                  NODE_ENV: production
            - name: Upload production build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: backend
                  path: ./backend/dist
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Update deployment-run-id parameter
              run: aws ssm put-parameter --name "deployment-run-id" --type "String" --value "$GITHUB_RUN_ID" --overwrite

    deploy-backend-api:
        name: Deploy Backend API
        needs: build-backend
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            AUTO_SCALING_GROUP_NAME: ${{ vars.AUTO_SCALING_GROUP_NAME }}
        steps:
            - name: Validate deployment configuration
              run: |
                  test -n "$AUTO_SCALING_GROUP_NAME" || { echo "AUTO_SCALING_GROUP_NAME repository variable is required" >&2; exit 1; }
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Refresh Auto Scaling group
              run: |
                  aws autoscaling start-instance-refresh \
                  --auto-scaling-group-name "$AUTO_SCALING_GROUP_NAME" \
                  --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180, "SkipMatching": false}'

    deploy-backend-db:
        name: Deploy Backend Database
        needs: build-backend
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            RDS_INSTANCE_ID: ${{ vars.RDS_INSTANCE_ID }}
            MIGRATION_EC2_INSTANCE_ID: ${{ vars.MIGRATION_EC2_INSTANCE_ID }}
        steps:
            - name: Validate deployment configuration
              run: |
                  test -n "$RDS_INSTANCE_ID" || { echo "RDS_INSTANCE_ID repository variable is required" >&2; exit 1; }
                  test -n "$MIGRATION_EC2_INSTANCE_ID" || { echo "MIGRATION_EC2_INSTANCE_ID repository variable is required" >&2; exit 1; }
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Determine connection details
              run: |
                  DB_HOST=$(aws rds describe-db-instances --db-instance-identifier "$RDS_INSTANCE_ID" --query "DBInstances[0].Endpoint.Address" --output text)
                  SECRET_ARN=$(aws rds describe-db-instances --db-instance-identifier "$RDS_INSTANCE_ID" --query "DBInstances[0].MasterUserSecret.SecretArn" --output text)

                  PGPASSWORD=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query SecretString --output text | jq -r .password)
                  PGPASSWORD_URL=$(node -e "console.log(new URLSearchParams({pass: \"$PGPASSWORD\"}).toString().substring(5))")

                  echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
                  echo "DATABASE_URL=postgres://dbadmin:$PGPASSWORD_URL@$DB_HOST:15432/appdb?sslmode=verify-full&sslrootcert=global-bundle.pem" >> "$GITHUB_ENV"
            - name: Download global certificate bundle
              run: curl -sSfLo ./backend/global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
            - name: Map 127.0.0.1 to $DB_HOST
              run: echo "127.0.0.1 $DB_HOST" | sudo tee -a /etc/hosts
            - name: Perform DB migration
              run: |
                  aws ssm start-session \
                    --target "$MIGRATION_EC2_INSTANCE_ID" \
                    --document-name AWS-StartPortForwardingSessionToRemoteHost \
                    --parameters "{\"host\":[\"$DB_HOST\"],\"portNumber\":[\"5432\"],\"localPortNumber\":[\"15432\"]}" &
                  SSM_PID=$!
                  sleep 3
                  pnpm --dir backend prisma db migrate
                  kill $SSM_PID
