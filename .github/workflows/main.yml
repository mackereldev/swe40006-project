name: Main

on:
    push:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    ci:
        name: Formatting and Static Analysis
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Check formatting
              run: pnpm run format
            - name: Run lint
              run: pnpm run lint
            - name: Compile backend
              run: pnpm exec tsc --noEmit
              working-directory: ./backend
            - name: Compile frontend
              run: pnpm exec tsc --noEmit
              working-directory: ./frontend

    aws-access-smoke-test:
        name: AWS Deployment Preflight
        needs: ci
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            S3_BUCKET: ${{ vars.S3_BUCKET }}
            CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        steps:
            - name: Validate deployment configuration
              run: |
                  test -n "$S3_BUCKET" || { echo "S3_BUCKET repository variable is required" >&2; exit 1; }
                  test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "CLOUDFRONT_DISTRIBUTION_ID repository variable is required" >&2; exit 1; }
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Verify assumed AWS role
              run: aws sts get-caller-identity
            - name: Verify S3 bucket and CloudFront distribution access
              run: |
                  aws s3api head-bucket --bucket "$S3_BUCKET"
                  aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" >/dev/null
            - name: Test S3 upload, read, and cleanup
              run: |
                  set -euo pipefail
                  aws s3api head-bucket --bucket "$S3_BUCKET"

                  object_key="_ci-smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.txt"
                  source_file="$(mktemp)"
                  downloaded_file="$(mktemp)"
                  cleanup() {
                    aws s3api delete-object --bucket "$S3_BUCKET" --key "$object_key" >/dev/null || \
                      echo "Warning: failed to delete S3 smoke-test object s3://${S3_BUCKET}/${object_key}" >&2
                    rm -f "$source_file" "$downloaded_file"
                  }
                  trap cleanup EXIT

                  printf '%s\n' "GitHub Actions S3 access test ${GITHUB_RUN_ID}" > "$source_file"
                  aws s3api put-object --bucket "$S3_BUCKET" --key "$object_key" --body "$source_file" >/dev/null
                  aws s3api get-object --bucket "$S3_BUCKET" --key "$object_key" "$downloaded_file" >/dev/null
                  cmp "$source_file" "$downloaded_file"
                  echo "S3 upload and read succeeded for the temporary smoke-test object."

    deploy-frontend:
        name: Build & Deploy Frontend
        needs: aws-access-smoke-test
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            S3_BUCKET: ${{ vars.S3_BUCKET }}
            CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
            VITE_API_URL: ${{ vars.PROD_API_URL }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build frontend
              run: pnpm --dir frontend run build
            - name: Validate deployment configuration
              run: |
                  test -n "$S3_BUCKET" || { echo "S3_BUCKET repository variable is required" >&2; exit 1; }
                  test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "CLOUDFRONT_DISTRIBUTION_ID repository variable is required" >&2; exit 1; }
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Upload frontend to private S3
              run: aws s3 sync frontend/dist/ "s3://${S3_BUCKET}/" --delete
            - name: Invalidate CloudFront cache
              run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

    build-backend:
        name: Build Backend
        needs: aws-access-smoke-test
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build backend
              run: pnpm --dir backend run build
            - name: Upload production build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: backend
                  path: ./backend/dist
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Update deployment-run-id parameter
              run: aws ssm put-parameter --name "deployment-run-id" --type "String" --value "$GITHUB_RUN_ID" --overwrite

    deploy-backend-api:
        name: Deploy Backend API
        needs: build-backend
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            AUTO_SCALING_GROUP_NAME: ${{ vars.AUTO_SCALING_GROUP_NAME }}
        steps:
            - name: Validate deployment configuration
              run: |
                  test -n "$AUTO_SCALING_GROUP_NAME" || { echo "AUTO_SCALING_GROUP_NAME repository variable is required" >&2; exit 1; }
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Refresh Auto Scaling group
              run: |
                  aws autoscaling start-instance-refresh \
                  --auto-scaling-group-name "$AUTO_SCALING_GROUP_NAME" \
                  --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180, "SkipMatching": false}'

    deploy-backend-db:
        name: Deploy Backend Database
        needs: build-backend
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            RDS_INSTANCE_ID: ${{ vars.RDS_INSTANCE_ID }}
            MIGRATION_EC2_INSTANCE_ID: ${{ vars.MIGRATION_EC2_INSTANCE_ID }}
        steps:
            - name: Validate deployment configuration
              run: |
                  test -n "$RDS_INSTANCE_ID" || { echo "RDS_INSTANCE_ID repository variable is required" >&2; exit 1; }
                  test -n "$MIGRATION_EC2_INSTANCE_ID" || { echo "MIGRATION_EC2_INSTANCE_ID repository variable is required" >&2; exit 1; }
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::418043654854:role/github-actions-guestbook-deploy
                  aws-region: ap-southeast-2
            - name: Determine connection details
              run: |
                  DB_HOST=$(aws rds describe-db-instances --db-instance-identifier "$RDS_INSTANCE_ID" --query "DBInstances[0].Endpoint.Address" --output text)
                  SECRET_ARN=$(aws rds describe-db-instances --db-instance-identifier "$RDS_INSTANCE_ID" --query "DBInstances[0].MasterUserSecret.SecretArn" --output text)

                  PGPASSWORD=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query SecretString --output text | jq -r .password)
                  PGPASSWORD_URL=$(node -e "console.log(new URLSearchParams({pass: \"$PGPASSWORD\"}).toString().substring(5))")

                  echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
                  echo "DATABASE_URL=postgres://dbadmin:$PGPASSWORD_URL@$DB_HOST:15432/appdb?sslmode=verify-full&sslrootcert=global-bundle.pem" >> "$GITHUB_ENV"
            - name: Download global certificate bundle
              run: curl -sSfLo ./backend/global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
            - name: Map 127.0.0.1 to $DB_HOST
              run: echo "127.0.0.1 $DB_HOST" | sudo tee -a /etc/hosts
            - name: Perform DB migration
              run: |
                  aws ssm start-session \
                    --target "$MIGRATION_EC2_INSTANCE_ID" \
                    --document-name AWS-StartPortForwardingSessionToRemoteHost \
                    --parameters "{\"host\":[\"$DB_HOST\"],\"portNumber\":[\"5432\"],\"localPortNumber\":[\"15432\"]}" &
                  SSM_PID=$!
                  sleep 3
                  pnpm --dir backend prisma db migrate
                  kill $SSM_PID
